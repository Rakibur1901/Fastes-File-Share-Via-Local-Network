<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Transfer Mobile</title>
    <style>
        :root { --bg: #0f172a; --card-bg: #1e293b; --accent: #2563eb; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 15px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; max-width: 440px; margin: 0 auto; text-align: center; }
        
        /* Navigation Tabs */
        .tab-bar { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: var(--text-muted); font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #60a5fa; border-bottom: 2px solid var(--accent); }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .drop-zone { border: 2px dashed var(--accent); border-radius: 12px; padding: 20px; cursor: pointer; margin-bottom: 15px; }
        input[type="file"] { display: none; }
        .btn-action { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .file-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .dl-link { background: #16a34a; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('uploadTab')">📤 Send to PC</button>
            <button class="tab-btn" onclick="switchTab('downloadTab')">📥 Get from PC</button>
        </div>

        <!-- TAB 1: SEND TO PC -->
        <div id="uploadTab" class="tab-content active">
            <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
                <div style="font-size:2rem;">📁</div>
                <div>Select Files to Upload</div>
                <input type="file" id="fileInput" multiple onchange="handleFiles(event)">
            </div>
            <div id="fileList"></div>
            <button class="btn-action" id="uploadBtn" onclick="uploadFiles()" disabled>Upload to PC</button>
        </div>

        <!-- TAB 2: DOWNLOAD FROM PC -->
        <div id="downloadTab" class="tab-content">
            <div id="pcFileList">Loading shared files...</div>
            <button class="btn-action" style="background:#334155;" onclick="loadPCFiles()">🔄 Refresh List</button>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
            if(tabId === 'downloadTab') loadPCFiles();
        }

        let selectedFiles = [];
        function handleFiles(e) {
            selectedFiles = Array.from(e.target.files);
            document.getElementById('uploadBtn').disabled = selectedFiles.length === 0;
            document.getElementById('fileList').innerHTML = selectedFiles.map(f => `<div class="file-item">${f.name}</div>`).join('');
        }

        async function uploadFiles() {
            const formData = new FormData();
            selectedFiles.forEach(f => formData.append('files', f));
            await fetch('/api/upload', { method: 'POST', body: formData });
            alert('Upload Complete!');
            selectedFiles = [];
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('uploadBtn').disabled = true;
        }

        async function loadPCFiles() {
            const res = await fetch('/api/shared-files');
            const data = await res.json();
            const container = document.getElementById('pcFileList');
            if (data.files.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted); padding:10px;">No files available in PC destination folder.</p>';
                return;
            }
            container.innerHTML = data.files.map(f => `
                <div class="file-item">
                    <span>${f.name}</span>
                    <a href="/download/${encodeURIComponent(f.name)}" class="dl-link" download>Download</a>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
